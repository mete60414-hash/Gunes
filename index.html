<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Güneş Sistemi Simülasyonu</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="scene">
      <header class="hud">
        <h1>Güneş Sistemi Simülasyonu</h1>
        <p>
          Gezegenlerin hızını kaydırıcılarla değiştirebilir, yıldızları
          sürükleyerek farklı açılar yakalayabilirsiniz.
        </p>
        <div class="controls">
          <label>
            Zaman Akışı
            <input id="timeScale" type="range" min="0.25" max="2.5" step="0.05" value="1" />
          </label>
          <label>
            Kamera Mesafesi
            <input id="zoom" type="range" min="0.6" max="1.4" step="0.02" value="1" />
          </label>
        </div>
      </header>

      <section class="universe" aria-label="Güneş sistemi" role="img">
        <div class="stars" aria-hidden="true"></div>
        <div class="sun" aria-label="Güneş"></div>

        <div class="orbit orbit-mercury">
          <div class="planet mercury" data-speed="4.1"></div>
        </div>
        <div class="orbit orbit-venus">
          <div class="planet venus" data-speed="3.2"></div>
        </div>
        <div class="orbit orbit-earth">
          <div class="planet earth" data-speed="2.4">
            <span class="moon"></span>
          </div>
        </div>
        <div class="orbit orbit-mars">
          <div class="planet mars" data-speed="2"></div>
        </div>
        <div class="orbit orbit-jupiter">
          <div class="planet jupiter" data-speed="1.2">
            <span class="moon moon-1"></span>
            <span class="moon moon-2"></span>
          </div>
        </div>
        <div class="orbit orbit-saturn">
          <div class="planet saturn" data-speed="0.95">
            <span class="ring"></span>
          </div>
        </div>
        <div class="orbit orbit-uranus">
          <div class="planet uranus" data-speed="0.75"></div>
        </div>
        <div class="orbit orbit-neptune">
          <div class="planet neptune" data-speed="0.6"></div>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
